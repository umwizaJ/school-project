name: CI pipeline for the app

on:
  push:
    branches:
      - dev
      - testing
      - staging
      - production
    paths:
      - 'Frontend/**'
      - 'Backend/**'
      - '.github/workflows/ci.yaml'

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      # Test Backend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Backend/package.json
      
      - name: Install Backend dependencies
        working-directory: /Backend
        run: npm ci
      
      - name: Run Backend tests
        working-directory: /Backend
        run: npm test
      
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: Backend/coverage/
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      branch: ${{ github.ref_name }}
    steps:
      # -------------------------------
      # Checkout repository
      # -------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------
      # Login to GitHub Container Registry
      # -------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Set branch name
      # -------------------------------
      - name: Set current branch name
        run: echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      # -------------------------------
      # Set up Docker buildx
      # -------------------------------
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------
      # Increment semantic version
      # -------------------------------
      - name: Increment semantic version
        uses: paulhatch/semantic-version@v5.4.0
        id: versioning
        with:
          bump_each_commit: true
          tag_prefix: "v"

      # -------------------------------
      # Set image tag and repo name
      # -------------------------------
      - name: Set image tag and name (lowercase)
        id: set-tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${REPO_LOWER}"
          TAG="${BRANCH_NAME}-v${{ steps.versioning.outputs.version }}"

          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          
          echo "Image: ${{ env.REGISTRY }}/${IMAGE_NAME}:${TAG}"

      # -------------------------------
      # Build & push BACKEND image
      # -------------------------------
      - name: Build & push BACKEND image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.set-tag.outputs.image }}/backend:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------
      # Build & push FRONTEND image
      # -------------------------------
      - name: Build & push FRONTEND image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.set-tag.outputs.image }}/frontend:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max