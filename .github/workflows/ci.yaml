name: CI pipeline for Web App
on:
  push:
    branches:
      - dev
      - testing
      - staging
      - production
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ci.yaml'

env:
    REGISTRY: ghcr.io
    
jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:                    
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      branch: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set current branch name
        run: echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
      
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Increment semantic version
        uses: paulhatch/semantic-version@v5.4.0
        id: versioning
        with:
          bump_each_commit: true
          tag_prefix: "v"
  
      - name: Set image tag and name (lowercase)
        id: set-tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${REPO_LOWER}/web-app"
          TAG="${{ env.BRANCH_NAME }}-v${{ steps.versioning.outputs.version }}"
          
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          
          echo "Image: ${{ env.REGISTRY }}/${IMAGE_NAME}:${TAG}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile 
          push: true
          build-args: |
            PROJECT_NAME=web-app
            ENV=${{ env.BRANCH_NAME }}
          tags: ${{ env.REGISTRY }}/${{ steps.set-tag.outputs.image }}:${{ steps.set-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max