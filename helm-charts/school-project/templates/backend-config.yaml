{{- if .Values.backend.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Release.Name }}-backend-health
  namespace: {{ .Release.Namespace }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: {{ .Values.backend.healthCheck.path }}
    port: {{ .Values.backend.healthCheck.port }}
{{- end }}